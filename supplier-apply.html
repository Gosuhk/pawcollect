<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>供應商入駐｜爪集</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>body{font-family:"Noto Sans TC",system-ui,sans-serif}</style>
</head>
<body data-page="supplier" class="bg-slate-900 text-slate-100 antialiased">
<header id="siteHeader" class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800"></header>
<main class="max-w-xl mx-auto px-4 py-10">
  <h1 class="text-4xl font-extrabold">供應商入駐</h1>
  <p class="mt-3 text-slate-400">請列出代理或自有品牌。每一款 SKU 都必須歸屬一個品牌，否則不會進入目錄。</p>
  <form class="mt-8 space-y-4 rounded-2xl border border-slate-700 bg-slate-800 p-6" onsubmit="event.preventDefault(); pcLogin('supplier')">
    <input required placeholder="品牌／公司名稱" class="w-full rounded-lg border border-slate-700 bg-slate-900 px-3 py-2" />
    <textarea required placeholder="品牌清單（每行一個）" class="w-full min-h-28 rounded-lg border border-slate-700 bg-slate-900 px-3 py-2"></textarea>
    <button class="w-full bg-orange-500 rounded-lg py-3 font-semibold">提交入駐（示範即開通）</button>
  </form>
</main>
<footer id="siteFooter" class="border-t border-slate-800 bg-slate-950 mt-16"></footer>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
</body>
</html>
