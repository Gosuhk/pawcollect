<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>批發專區｜爪集</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;600;800&display=swap" rel="stylesheet" />
<style>body{font-family:"Noto Sans TC",system-ui,sans-serif}.blur-price{filter:blur(6px);user-select:none}</style>
</head>
<body data-page="catalog" class="bg-slate-900 text-slate-100 antialiased">
<header id="siteHeader" class="sticky top-0 z-50 bg-slate-900/90 backdrop-blur border-b border-slate-800"></header>
<main class="max-w-7xl mx-auto px-4 py-10">
  <p class="text-xs tracking-[0.18em] text-slate-500">WHOLESALE CATALOGUE</p>
  <div class="mt-2 flex flex-col md:flex-row md:items-end justify-between gap-4">
    <div>
      <h1 class="text-4xl font-extrabold">批發專區</h1>
      <p class="mt-3 text-slate-400">排序：1 供應商 → 2 品牌 → 3 種類。冇品牌嘅貨唔入目錄。</p>
    </div>
    <p id="guestHint" class="text-sm text-orange-400 bg-orange-500/10 border border-orange-500/20 px-4 py-2 rounded-lg">訪客模式：批發價已隱藏</p>
  </div>
  <div class="mt-8 space-y-5">
    <div><p class="mb-2 text-xs tracking-widest text-slate-500">1. 供應商</p><div id="f1" class="flex flex-wrap gap-2"></div></div>
    <div><p class="mb-2 text-xs tracking-widest text-slate-500">2. 品牌</p><div id="f2" class="flex flex-wrap gap-2"></div></div>
    <div><p class="mb-2 text-xs tracking-widest text-slate-500">3. 種類</p><div id="f3" class="flex flex-wrap gap-2"></div></div>
  </div>
  <div id="list" class="mt-10 space-y-12"></div>
</main>
<footer id="siteFooter" class="border-t border-slate-800 bg-slate-950 mt-16"></footer>
<script src="js/data.js"></script>
<script src="js/site.js"></script>
<script>
const q = new URLSearchParams(location.search);
let fSup = q.get("sup") || "all";
let fBrand = q.get("brand") || "all";
let fCat = q.get("cat") || "all";
const see = PC.verified();
if (see) guestHint.textContent = "已登入：批發價已解鎖";
function listed(){ return PC.listed(); }
function chip(on,label,fn){return `<button type="button" onclick="${fn}" class="h-11 rounded-full px-4 text-sm ${on?"bg-orange-500 text-white":"border border-slate-700 text-slate-300"}">${label}</button>`}
function srcBySup(){ return listed().filter(p => fSup==="all" || p.supplier===fSup); }
function brandsOf(){ return [...new Set(srcBySup().map(p=>p.brand))]; }
function catsOf(){
  const src = srcBySup().filter(p => fBrand==="all" || p.brand===fBrand);
  const ids = new Set(src.map(p=>p.category));
  return PC.CATS.filter(c => c.id==="all" || ids.has(c.id));
}
function setF(t,v){
  if(t==="sup"){ fSup=v; fBrand="all"; fCat="all"; }
  if(t==="brand"){ fBrand=v; const ok=catsOf().some(c=>c.id===fCat); if(!ok) fCat="all"; }
  if(t==="cat") fCat=v;
  draw();
}
function draw(){
  const brands = brandsOf();
  if(fBrand!=="all" && !brands.includes(fBrand)) fBrand="all";
  const cats = catsOf();
  if(fCat!=="all" && !cats.some(c=>c.id===fCat)) fCat="all";
  f1.innerHTML = chip(fSup==="all","全部供應商","setF('sup','all')")+PC.SUPPLIERS.map(s=>chip(fSup===s.name,s.name,`setF('sup','${s.name}')`)).join("");
  f2.innerHTML = chip(fBrand==="all","全部品牌","setF('brand','all')")+brands.map(b=>chip(fBrand===b,b,`setF('brand','${b}')`)).join("");
  f3.innerHTML = cats.map(c=>chip(fCat===c.id,c.label,`setF('cat','${c.id}')`)).join("");
  const rows = listed().filter(p => (fSup==="all"||p.supplier===fSup) && (fBrand==="all"||p.brand===fBrand) && (fCat==="all"||p.category===fCat));
  const catOrder = Object.fromEntries(PC.CATS.map((c,i)=>[c.id,i]));
  const tree=[];
  rows.forEach(p=>{
    let s=tree.find(x=>x.name===p.supplier);
    if(!s){s={name:p.supplier,brands:[]};tree.push(s)}
    let b=s.brands.find(x=>x.name===p.brand);
    if(!b){b={name:p.brand,cats:[]};s.brands.push(b)}
    let g=b.cats.find(x=>x.id===p.category);
    if(!g){g={id:p.category,label:PC.catLabel(p.category),items:[]};b.cats.push(g)}
    g.items.push(p);
  });
  tree.forEach(s=>s.brands.forEach(b=>b.cats.sort((a,c)=>(catOrder[a.id]??99)-(catOrder[c.id]??99))));
  list.innerHTML = tree.length? tree.map(s=>`
    <section>
      <h2 class="text-2xl font-extrabold">${s.name}</h2>
      ${s.brands.map(b=>`
        <div class="mt-8">
          <h3 class="text-lg font-bold text-orange-400">${b.name}</h3>
          ${b.cats.map(g=>`
            <div class="mt-4">
              <div class="mb-3 flex justify-between border-b border-slate-800 pb-2">
                <p class="text-sm text-slate-300">${g.label}</p>
                <span class="text-xs text-slate-500">${g.items.length} 款</span>
              </div>
              <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5">
                ${g.items.map(p=>`
                  <article class="rounded-2xl border border-slate-700 bg-slate-800 p-5 flex flex-col">
                    <p class="text-xs text-slate-500">${p.sku} · ${p.brand} · ${PC.catLabel(p.category)}</p>
                    <h4 class="mt-2 font-bold">${p.name}</h4>
                    <p class="mt-2 text-sm text-slate-400 flex-1">${p.summary}</p>
                    <div class="mt-4 pt-4 border-t border-slate-700 flex items-end justify-between">
                      <div>
                        <p class="text-xs text-slate-500">批發價</p>
                        <p class="${see?"":"blur-price"} text-lg font-bold text-orange-400">${PC.money(p.wholesale)}</p>
                        <p class="text-xs text-slate-500">MOQ ${p.moq}${p.unit}</p>
                      </div>
                      ${see && PC.session().role==="retailer"
                        ? `<button onclick="PC.addCart('${p.id}')" class="bg-orange-500 text-sm font-semibold px-4 py-2 rounded-lg">加入批發單</button>`
                        : `<button onclick="openModal()" class="bg-slate-700 text-sm px-4 py-2 rounded-lg">登入解鎖報價</button>`}
                    </div>
                  </article>`).join("")}
              </div>
            </div>`).join("")}
        </div>`).join("")}
    </section>`).join("") : `<p class="text-slate-400">沒有符合的貨品。請確認 SKU 已填品牌。</p>`;
}
draw();
</script>
</body>
</html>
